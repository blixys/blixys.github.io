<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>blixys</title>
  <link rel="icon" type="image/x-icon" href="images/favicon.ico" />
  <link rel="stylesheet" href="../mystyle.css" />
  <style>
    footer {
      text-align: right;
      padding: 0px;
      font-size: 10pt;
      color: #808080;
    }
  </style>
</head>
<body>
  <div class="site">
    <a href="../index.html"><img src="../images/logo.svg" alt="blixys logo" width="40" height="40" /></a>
    <img
      src="../images/wordmark.svg"
      alt="blixys wordmark"
      width="50"
      style="margin-top: 5px; display: block;"
    />
    <div style="display: flex; justify-content: space-between; width: 100%; margin: 0;">
    <a href="../a" style="text-decoration:none; color: black;"><p style="text-align: left; font-size: 48pt; margin: 0;">artwork</p></a>
    <img id="artworkIcon" src="../images/artwork.png" alt="artwork icon" style="cursor: pointer;">
    </div>
    <audio id="clickSound" src="../sounds/artwork.wav" preload="auto"></audio>
    <img src="RANDOMIMAGEHERE" alt="">
    <br>
    <footer>
      <p>
        © 2025 blixys. All works are under copyright and may not be reused
        without permission.<br />
        Website source code is open source and licensed under the MIT License.
        <a href="https://github.com/blixys/blixys.github.io">View on GitHub</a>.
      </p>
    </footer>
  </div>
    <script>
    const artworkIcon = document.getElementById("artworkIcon");
    const clickSound = document.getElementById("clickSound");

    artworkIcon.addEventListener("click", () => {
      clickSound.currentTime = 0;
      clickSound.play();
    });
  </script>
</body>
</html>
