<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="stylesheet" href="../fonts/texgyreheros.css">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact - blixys</title>
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<link rel="manifest" href="/site.webmanifest">
  <link rel="stylesheet" href="../mystyle.css" />
  <link rel="preload" href="beepc.ogg" as="audio">
  <link rel="preload" href="../fonts/TeXGyreHeros-Regular.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="../wyit/wyitfonts/NewCM10-Book.woff2" as="font" type="font/woff2" crossorigin>
  <style>
    @font-face {
  font-family: 'New Computer Modern';
  src: url('../wyit/wyitfonts/NewCM10-Book.woff2') format('woff2');
  font-weight: normal;
  font-style: normal;
}
    html, body{
      height: 100%;
      margin: 0;
    }
    footer {
      text-align: right;
      padding: 0px;
      font-size: 10pt;
      color: #808080;
    }
    img {
      max-width: 100%;
      height: auto;
    }
    body{
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .disabled {
      opacity: 0.5;
      cursor: not-allowed !important;
    }
    #pointofcontact{
      height: 100px;
      width: 100px;
      background-color: #000;
      border-radius: 50%;
      display: inline-block;
		}
    
  </style>
</head>
<body>
  <div id="pointofcontact" style="cursor: pointer;" alt="pointofcontact"></div>
  <div style="font-family: 'TexGyreHerosCondensed', sans-serif; position: absolute; width: 0; height: 0; overflow: hidden; visibility: hidden;">
  preload
</div>
</body>
  <audio id="clickSound" src="pointofcontact.wav" preload="auto"></audio>
   <script>
    const puff = document.getElementById("pointofcontact");
    const clickSound = document.getElementById("clickSound");
    let isPlaying = false;
    let canClick = true;
    
    const preloadedSound = new Audio('beepc.ogg');
    preloadedSound.preload = 'auto';
    preloadedSound.load();

    puff.addEventListener("click", () => {
      if (!canClick) return;
      canClick = false;
      puff.classList.add('disabled');
      const s = preloadedSound.cloneNode();
      s.play().catch(e => {});
      setTimeout(() => {
        puff.classList.remove('disabled');
        canClick = true;
      showEmailForm()
      }, 0);
    });

function showEmailForm() {
  const formContainer = document.createElement('div');
  formContainer.id = 'emailFormContainer';
  formContainer.innerHTML = `
    <style>
      #emailFormContainer {
        border: 1px solid #000;
        background: #fff;
        padding: 8px;
        font-family: 'TexGyreHeros', monospace, sans-serif;
        width: 100%;
        max-width: 550px;
        box-sizing: border-box;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        text-rendering: optimizeLegibility;
      }
      
      .sys-header {
        background: #000;
        color: #fff;
        padding: 4px 8px;
        margin-bottom: 8px;
        font-size: 14px;
        display: flex;
        justify-content: space-between;
      }
      
      .field-group {
        border: 1px solid #000;
        margin-bottom: 8px;
        padding: 6px;
        background: #fff;
      }
      
      .field-label {
        font-size: 12px;
        text-transform: uppercase;
        margin-bottom: 4px;
        display: flex;
        justify-content: space-between;
        border-bottom: 1px solid #000;
        padding-bottom: 2px;
      }

      #emailFormContainer input:not([type="hidden"]),
      #emailFormContainer textarea {
        width: 100%;
        padding: 4px 0;
        border: none;
        background: transparent;
        font-family: inherit;
        font-size: 16px;
        box-sizing: border-box;
      }
      
      #emailFormContainer input:focus,
      #emailFormContainer textarea:focus {
        outline: none;
        background: #eef;
      }
      
      #emailFormContainer textarea {
        resize: vertical;
        min-height: 120px;
      }
      
      #emailFormContainer button {
        width: 100%;
        padding: 10px;
        background: #000;
        color: #fff;
        border: 1px solid #000;
        font-family: inherit;
        font-size: 16px;
        text-transform: uppercase;
        cursor: pointer;
      }
      
      #emailFormContainer button:hover {
        background: #fff;
        color: #000;
      }
      
      #emailFormContainer button:active {
        background: #ff0000;
        color: #fff;
      }
    </style>
    
    <div class="sys-header">
      <span>Contact</span>
    </div>

    <form action="https://formsubmit.co/blixys@blixys.com" method="POST">
      <input type="hidden" name="_subject" value="from blixys.com">
      <input type="hidden" name="_next" value="https://blixys.com/contact/thank-you">
      <input type="hidden" name="_captcha" value="false">
      
      <div style="display: flex; gap: 8px; margin-bottom: 0;">
        <div class="field-group" style="flex: 1;">
          <div class="field-label"><span>Name</span><span>*</span></div>
          <input type="text" name="name" required autocomplete="off">
        </div>
        <div class="field-group" style="flex: 1;">
          <div class="field-label"><span>Email</span><span>*</span></div>
          <input type="email" name="email" required autocomplete="off">
        </div>
      </div>
      
      <div class="field-group">
        <div class="field-label"><span>Ask me Anything</span><span>*</span></div>
        <textarea name="message" required></textarea>
      </div>
      
      <button type="submit">Send</button>
    </form>   
  `;
  puff.parentNode.replaceChild(formContainer, puff); //[cite: 2]
}
  </script>
</html>
