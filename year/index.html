    <script>
    function updateYearProgress() {
      const now = new Date();
      const startOfYear = new Date(now.getFullYear(), 0, 1);
      const endOfYear = new Date(now.getFullYear() + 1, 0, 1);
      const progress = ((now - startOfYear) / (endOfYear - startOfYear)) * 100;

      const progressBar = document.getElementById("yearProgressBar");
      const progressText = document.getElementById("yearProgressText");
      const yearDateTime = document.getElementById("yearDateTime")

      const formatter = new Intl.DateTimeFormat('en-US', {
        timeZone: 'America/Los_Angeles',
        year: 'numeric',
        month: '2-digit',
        day: '2-digit',
        hour: '2-digit',
        minute: '2-digit',
        hour12: true
      });

      const parts = formatter.formatToParts(now);

      const year = parts.find(p => p.type === 'year').value;
      const month = parts.find(p => p.type === 'month').value;
      const day = parts.find(p => p.type === 'day').value;
      const hour = parts.find(p => p.type === 'hour').value;
      const minute = parts.find(p => p.type === 'minute').value;
      const ampm = parts.find(p => p.type === 'dayPeriod').value.toLowerCase();

      const dateTimeString = `${year}-${month}-${day} ${hour}:${minute}${ampm} PT`;
      document.getElementById("dt-prefix").textContent =
      `${year}-${month}-${day} ${hour}`;
      document.getElementById("dt-suffix").textContent =
      `${minute}${ampm} PT`;

      
      const preciseProgress = progress.toFixed(8);
      progressBar.style.width = preciseProgress + "%";
      progressText.textContent = preciseProgress + "%";

function startRealSecondBlink() {
  const colon = document.getElementById("blink-colon");

  function sync() {
    const now = new Date();
    colon.style.visibility =
      now.getSeconds() % 2 === 0 ? "visible" : "hidden";
  }

  sync();

  const msUntilNextSecond = 1000 - (Date.now() % 1000);
  setTimeout(() => {
    sync();
    setInterval(sync, 1000);
  }, msUntilNextSecond);
}

startRealSecondBlink();



    }
    setInterval(updateYearProgress, 1);
    updateYearProgress();
    </script>
